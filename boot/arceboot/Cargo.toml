[package]
name = "arceboot"
version = "0.0.1"
edition.workspace = true
license = "MIT"
repository.workspace = true
authors = ["Zhihang Shao <dio_ro@outlook.com>", "Jingxuan Wei <jensenwei007@gmail.com>"]
description = "Cross-platform operating system bootloader built from tgoskits components"
publish = false

[features]
default = ["alloc", "paging", "ramdisk_cpio"]

alloc = ["dep:ax-alloc"]
paging = ["ax-hal/paging", "dep:ax-mm"]

# Filesystem-backed boot media. Not ported to the tgoskits driver stack yet:
# it needs a virtio-blk rdif driver plus an ax-fs-ng runtime adapter.
fs = []
net = ["dep:ax-driver", "dep:ax-net", "dep:rdrive", "ax-driver/net"]
display = ["dep:ax-driver", "dep:ax-display", "dep:rdrive", "ax-driver/display"]

# Boot Media
ramdisk_cpio = []

[dependencies]
ax-hal = { workspace = true }
ax-log = { workspace = true }
ax-sync = { workspace = true }
ax-alloc = { workspace = true, optional = true }
ax-mm = { workspace = true, optional = true }
ax-driver = { workspace = true, optional = true }
ax-net = { workspace = true, optional = true }
ax-display = { workspace = true, optional = true }
ax-plat = { workspace = true }
ax-io = { workspace = true, features = ["alloc"] }
ax-memory-addr = { workspace = true }
ax-crate-interface = { workspace = true }
ax-ctor-bare = { workspace = true }
ax-lazyinit = { workspace = true }
axklib = { workspace = true, features = ["buddy-slab"] }
rdrive = { workspace = true, optional = true }
sbi-rt = { workspace = true, features = ["legacy"] }

cfg-if = "1.0.1"
object = { version = "0.38", default-features = false, features = ["read", "pe"] }
chrono = { workspace = true }
uefi-raw = "0.14.0"
