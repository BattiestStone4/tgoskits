args = [
    "-nographic",
    "-cpu",
    "rv64",
    "-device",
    "virtio-blk-pci,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/riscv64gc-unknown-none-elf/rootfs-riscv64.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = '''
sh -c '
pass=0
fail=0

check_help() {
    _name="$1"; _cmd="$2"; _expect="$3"
    _out=$($_cmd 2>&1)
    if echo "$_out" | grep -q "$_expect"; then
        echo "PASS: $_name"; pass=$((pass + 1))
    else
        echo "FAIL: $_name [expected '"'"'$_expect'"'"' got '"'"'$_out'"'"']"; fail=$((fail + 1))
    fi
}

echo "=== busybox-help: shallow -h + Usage tests ==="

check_help "acpid"          "busybox acpid -h 2>&1"                  "Usage"
check_help "add_shell"      "busybox add-shell -h 2>&1"              "Usage"
check_help "chattr"         "busybox chattr -h 2>&1"                 "Usage"
check_help "chpasswd"       "busybox chpasswd -h 2>&1"               "Usage"
check_help "chvt"           "busybox chvt -h 2>&1"                   "Usage"
check_help "cryptpw"        "busybox cryptpw -h 2>&1"                "Usage"
check_help "deallocvt"      "busybox deallocvt -h 2>&1"              "Usage"
check_help "depmod"         "busybox depmod -h 2>&1"                 "Usage"
check_help "dmesg"          "busybox dmesg -h 2>&1"                  "Usage"
check_help "dumpkmap"       "busybox dumpkmap -h 2>&1"               "Usage"
check_help "eject"          "busybox eject -h 2>&1"                  "Usage"
check_help "ether_wake"     "busybox ether-wake 2>&1"                "Usage"
check_help "fbsplash"       "busybox fbsplash -h 2>&1"               "Usage"
check_help "fdflush"        "busybox fdflush -h 2>&1"                "Usage"
check_help "fdisk"          "busybox fdisk -h 2>&1"                  "Usage"
check_help "findfs"         "busybox findfs -h 2>&1"                 "Usage"
check_help "fstrim"         "busybox fstrim -h 2>&1"                 "Usage"
check_help "fuser"          "busybox fuser -h 2>&1"                  "Usage"
check_help "getty"          "busybox getty -h 2>&1"                  "Usage"
check_help "halt"           "busybox halt -h 2>&1"                   "Usage"
check_help "ifenslave"      "busybox ifenslave 2>&1"                 "Usage"
check_help "ifup"           "busybox ifup -h 2>&1"                   "Usage"
check_help "init"           "busybox init 2>&1"                      "PID 1"
check_help "inotifyd"       "busybox inotifyd -h 2>&1"               "Usage"
check_help "insmod"         "busybox insmod -h 2>&1"                 "Usage"
check_help "ipcrm"          "busybox ipcrm -h 2>&1"                  "Usage"
check_help "kbd_mode"       "busybox kbd_mode -h 2>&1"               "Usage"
check_help "killall5"       "busybox killall5 -h 2>&1"               "Usage"
check_help "klogd"          "busybox klogd -h 2>&1"                  "Usage"
check_help "last"           "busybox last -h 2>&1"                   "Usage"
check_help "less"           "busybox less -h 2>&1"                   "Usage"
check_help "loadfont"       "busybox loadfont -h 2>&1"               "Usage"
check_help "loadkmap"       "busybox loadkmap -h 2>&1"               "Usage"
check_help "logger"         "busybox logger -h 2>&1"                 "Usage"
check_help "login"          "busybox login -h 2>&1"                  "Usage"
check_help "lsmod"          "busybox lsmod 2>&1"                     ""
check_help "lsof"           "busybox lsof 2>&1"                      ""
check_help "lsusb"          "busybox lsusb 2>&1"                     ""
check_help "makemime"       "busybox makemime -h 2>&1"               "Usage"
check_help "mdev"           "busybox mdev -h 2>&1"                   "Usage"
check_help "microcom"       "busybox microcom -h 2>&1"               "Usage"
check_help "mkdosfs"        "busybox mkdosfs -h 2>&1"                "Usage"
check_help "mkfs_vfat"      "busybox mkfs.vfat -h 2>&1"              "Usage"
check_help "mknod"          "busybox mknod -h 2>&1"                  "Usage"
check_help "mkswap"         "busybox mkswap -h 2>&1"                 "Usage"
check_help "modinfo"        "busybox modinfo -h 2>&1"                "Usage"
check_help "modprobe"       "busybox modprobe -h 2>&1"               "Usage"
check_help "nameif"         "busybox nameif -h 2>&1"                 "Usage"
check_help "nanddump"       "busybox nanddump -h 2>&1"               "Usage"
check_help "nandwrite"      "busybox nandwrite -h 2>&1"              "Usage"
check_help "nbd_client"     "busybox nbd-client -h 2>&1"             "Usage"
check_help "nmeter"         "busybox nmeter -h 2>&1"                 "Usage"
check_help "ntpd"           "busybox ntpd -h 2>&1"                   "Usage"
