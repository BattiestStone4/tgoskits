check_help "poweroff"       "busybox poweroff -h 2>&1"               "Usage"
check_help "pscan"          "busybox pscan -h 2>&1"                   "Usage"
check_help "raidautorun"    "busybox raidautorun -h 2>&1"            "Usage"
check_help "rdate"          "busybox rdate -h 2>&1"                  "Usage"
check_help "rdev"           "busybox rdev -h 2>&1"                   "Usage"
check_help "reboot"         "busybox reboot -h 2>&1"                 "Usage"
check_help "reformime"      "busybox reformime -h 2>&1"              "Usage"
check_help "remove_shell"   "busybox remove-shell -h 2>&1"           "Usage"
check_help "resize"         "busybox resize -h 2>&1"                 "Usage"
check_help "rmmod"          "busybox rmmod -h 2>&1"                  "Usage"
check_help "sendmail"       "busybox sendmail -h 2>&1"               "Usage"
check_help "setconsole"     "busybox setconsole -h 2>&1"             "Usage"
check_help "setfont"        "busybox setfont -h 2>&1"                "Usage"
check_help "setkeycodes"    "busybox setkeycodes -h 2>&1"            "Usage"
check_help "setlogcons"     "busybox setlogcons -h 2>&1"             "Usage"
check_help "setserial"      "busybox setserial -h 2>&1"              "Usage"
check_help "showkey"        "busybox showkey -h 2>&1"                "Usage"
check_help "slattach"       "busybox slattach -h 2>&1"               "Usage"
check_help "su"             "busybox su -h 2>&1"                     "Usage"
check_help "swapoff"        "busybox swapoff -h 2>&1"                "Usage"
check_help "swapon"         "busybox swapon -h 2>&1"                 "Usage"
check_help "switch_root"    "busybox switch_root -h 2>&1"            "Usage"
check_help "syslogd"        "busybox syslogd -h 2>&1"                "Usage"
check_help "tunctl"         "busybox tunctl -h 2>&1"                 "Usage"
check_help "udhcpc"         "busybox udhcpc -h 2>&1"                 "Usage"
check_help "udhcpc6"        "busybox udhcpc6 -h 2>&1"                "Usage"
check_help "umount"         "busybox umount -h 2>&1"                 "Usage"
check_help "unlzma"         "busybox unlzma -h 2>&1"                 "Usage"
check_help "unlzop"         "busybox unlzop -h 2>&1"                 "Usage"
check_help "unxz"           "busybox unxz -h 2>&1"                   "Usage"
check_help "unzip"          "busybox unzip -h 2>&1"                  "Usage"
check_help "vconfig"        "busybox vconfig -h 2>&1"                "Usage"
check_help "vi"             "busybox vi -h 2>&1"                     "Usage"
check_help "vlock"          "busybox vlock -h 2>&1"                  "Usage"
check_help "watch"          "busybox watch -h 2>&1"                  "Usage"
check_help "watchdog"       "busybox watchdog -h 2>&1"               "Usage"
check_help "whois"          "busybox whois -h 2>&1"                  "Usage"
check_help "xzcat"          "busybox xzcat -h 2>&1"                  "Usage"
check_help "zcip"           "busybox zcip -h 2>&1"                   "Usage"

echo ""
echo "DONE: $pass pass, $fail fail"
'
'''
success_regex = ["(?m)DONE: \\d+ pass, \\d+ fail"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 120
