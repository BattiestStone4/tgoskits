args = [
    "-nographic",
    "-device",
    "virtio-blk-pci,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/x86_64-unknown-none/rootfs-x86_64.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = false
shell_prefix = "root@starry:"
shell_init_cmd = '''
pass=0
fail=0

run_test() {
    _name="$1"
    _expect="$2"
    shift 2
    _out=$("$@" 2>&1)
    if [ -n "$_expect" ]; then
        if echo "$_out" | grep -q "$_expect"; then
            echo "PASS: $_name"; pass=$((pass + 1))
        else
            echo "FAIL: $_name [got: $_out]"; fail=$((fail + 1))
        fi
    else
        if [ -n "$_out" ]; then
            echo "PASS: $_name"; pass=$((pass + 1))
        else
            echo "FAIL: $_name [empty output]"; fail=$((fail + 1))
        fi
    fi
}

echo "=== busybox-basic: userspace computation ==="

run_test "echo"        "echo_ok"       busybox echo echo_ok
run_test "basename"    "foo"           busybox basename /usr/bin/foo
run_test "dirname"     "/usr/bin"      busybox dirname /usr/bin/foo
run_test "seq"         "3"             busybox seq 1 3
run_test "factor"      "2 3"           busybox factor 6
run_test "nl"          "root:"         busybox nl -ba /etc/passwd
run_test "hd"          "00000000"      busybox hd -n 64 /etc/passwd
run_test "strings"     "BusyBox"       busybox strings /bin/busybox
run_test "cksum"       "/etc/passwd"   busybox cksum /etc/passwd
run_test "bbconfig"    "CONFIG"        busybox bbconfig 2>&1

# Tests needing pipes: run inline, check output
busybox echo test | busybox base64 | grep -q dGVzdAo= && { echo "PASS: base64"; pass=$((pass+1)); } || { echo "FAIL: base64"; fail=$((fail+1)); }
echo hello | busybox grep hell | grep -q hello && { echo "PASS: grep"; pass=$((pass+1)); } || { echo "FAIL: grep"; fail=$((fail+1)); }
echo hello | busybox egrep hell | grep -q hello && { echo "PASS: egrep"; pass=$((pass+1)); } || { echo "FAIL: egrep"; fail=$((fail+1)); }
echo hello | busybox fgrep hell | grep -q hello && { echo "PASS: fgrep"; pass=$((pass+1)); } || { echo "FAIL: fgrep"; fail=$((fail+1)); }
printf "c\na\nb\n" | busybox sort | busybox head -n1 | grep -q a && { echo "PASS: sort"; pass=$((pass+1)); } || { echo "FAIL: sort"; fail=$((fail+1)); }
echo "a:b:c" | busybox cut -d: -f2 | grep -q b && { echo "PASS: cut"; pass=$((pass+1)); } || { echo "FAIL: cut"; fail=$((fail+1)); }
echo abc | busybox tr a-z A-Z | grep -q ABC && { echo "PASS: tr"; pass=$((pass+1)); } || { echo "FAIL: tr"; fail=$((fail+1)); }
echo abcd | busybox rev | grep -q dcba && { echo "PASS: rev"; pass=$((pass+1)); } || { echo "FAIL: rev"; fail=$((fail+1)); }
echo abcdef | busybox fold -w 2 | grep -q ab && { echo "PASS: fold"; pass=$((pass+1)); } || { echo "FAIL: fold"; fail=$((fail+1)); }
printf "a\na\nb\n" | busybox uniq | grep -q b && { echo "PASS: uniq"; pass=$((pass+1)); } || { echo "FAIL: uniq"; fail=$((fail+1)); }
printf "a\nb\nc\n" | busybox wc -l | grep -q 3 && { echo "PASS: wc"; pass=$((pass+1)); } || { echo "FAIL: wc"; fail=$((fail+1)); }
echo a b | busybox xargs echo X | grep -q "X a b" && { echo "PASS: xargs"; pass=$((pass+1)); } || { echo "FAIL: xargs"; fail=$((fail+1)); }
busybox printf "pf_%s_ok" bb | grep -q pf_bb_ok && { echo "PASS: printf"; pass=$((pass+1)); } || { echo "FAIL: printf"; fail=$((fail+1)); }
busybox echo 2+2 | busybox bc | grep -q 4 && { echo "PASS: bc"; pass=$((pass+1)); } || { echo "FAIL: bc"; fail=$((fail+1)); }
printf "2 2 + p\n" | busybox dc | grep -q 4 && { echo "PASS: dc"; pass=$((pass+1)); } || { echo "FAIL: dc"; fail=$((fail+1)); }
printf "a\nb\n" | busybox tac | grep -q a && { echo "PASS: tac"; pass=$((pass+1)); } || { echo "FAIL: tac"; fail=$((fail+1)); }
busybox awk -v x=awk_ok "BEGIN{print x}" | grep -q awk_ok && { echo "PASS: awk"; pass=$((pass+1)); } || { echo "FAIL: awk"; fail=$((fail+1)); }
echo hello | busybox sed "s/hello/sed_ok/" | grep -q sed_ok && { echo "PASS: sed"; pass=$((pass+1)); } || { echo "FAIL: sed"; fail=$((fail+1)); }
busybox ash -c "echo ash_ok" | grep -q ash_ok && { echo "PASS: ash"; pass=$((pass+1)); } || { echo "FAIL: ash"; fail=$((fail+1)); }
busybox sh -c "echo sh_ok" | grep -q sh_ok && { echo "PASS: sh"; pass=$((pass+1)); } || { echo "FAIL: sh"; fail=$((fail+1)); }
busybox expr 3 \* 4 | grep -q 12 && { echo "PASS: expr"; pass=$((pass+1)); } || { echo "FAIL: expr"; fail=$((fail+1)); }
busybox sleep 0 && echo sleep_ok | grep -q sleep_ok && { echo "PASS: sleep"; pass=$((pass+1)); } || { echo "FAIL: sleep"; fail=$((fail+1)); }
busybox true && echo true_ok | grep -q true_ok && { echo "PASS: true"; pass=$((pass+1)); } || { echo "FAIL: true"; fail=$((fail+1)); }
busybox test 1 -eq 1 && echo test_ok | grep -q test_ok && { echo "PASS: test"; pass=$((pass+1)); } || { echo "FAIL: test"; fail=$((fail+1)); }
busybox getopt -o ab: -- -a -b bar | grep -q bar && { echo "PASS: getopt"; pass=$((pass+1)); } || { echo "FAIL: getopt"; fail=$((fail+1)); }
busybox bbconfig 2>&1 | busybox head -1 | grep -q CONFIG && { echo "PASS: bbconfig2"; pass=$((pass+1)); } || { echo "FAIL: bbconfig2"; fail=$((fail+1)); }
echo | busybox md5sum | grep -q "-" && { echo "PASS: md5sum"; pass=$((pass+1)); } || { echo "FAIL: md5sum"; fail=$((fail+1)); }
echo | busybox sha1sum | grep -q "-" && { echo "PASS: sha1sum"; pass=$((pass+1)); } || { echo "FAIL: sha1sum"; fail=$((fail+1)); }
echo | busybox sha256sum | grep -q "-" && { echo "PASS: sha256sum"; pass=$((pass+1)); } || { echo "FAIL: sha256sum"; fail=$((fail+1)); }
echo | busybox sha512sum | grep -q "-" && { echo "PASS: sha512sum"; pass=$((pass+1)); } || { echo "FAIL: sha512sum"; fail=$((fail+1)); }
echo test | busybox od -tx1 | grep -q 74 && { echo "PASS: od"; pass=$((pass+1)); } || { echo "FAIL: od"; fail=$((fail+1)); }
echo -n ab | busybox hexdump -C | grep -q 61 && { echo "PASS: hexdump"; pass=$((pass+1)); } || { echo "FAIL: hexdump"; fail=$((fail+1)); }
printf Hi | busybox xxd | grep -q "48 69" && { echo "PASS: xxd"; pass=$((pass+1)); } || { echo "FAIL: xxd"; fail=$((fail+1)); }
busybox yes y | busybox head -n1 | grep -q y && { echo "PASS: yes"; pass=$((pass+1)); } || { echo "FAIL: yes"; fail=$((fail+1)); }

# false: check exit code
busybox false
[ $? -ne 0 ] && { echo "PASS: false_rc"; pass=$((pass+1)); } || { echo "FAIL: false_rc"; fail=$((fail+1)); }

# ls
ls / | grep -q bin && { echo "PASS: ls"; pass=$((pass+1)); } || { echo "FAIL: ls"; fail=$((fail+1)); }

echo ""
echo "DONE: $pass pass, $fail fail"
'''
success_regex = ["(?m)DONE: \\d+ pass, \\d+ fail"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 120
